{% extends "base.html" %}

{% block title %}イベント削除確認 | EventMatch{% endblock %}

{% block content %}

<section class="confirm-page">

    <div class="confirm-card">

        <h1>イベントを削除しますか？</h1>

        {% if event %}

            <div class="delete-event-info">

                <h2>
                    {{ event.title }}
                </h2>

                <p>
                    {{ event.start_at }}
                    〜
                    {{ event.end_at }}
                </p>

                <p>
                    {{ event.address }}
                </p>

            </div>

        {% endif %}


        <p class="warning-text">
            削除したイベントは元に戻せない場合があります。
        </p>


        <form method="post">

            {% csrf_token %}

            <div class="form-actions">

                <button
                    type="submit"
                    class="button button-danger"
                >
                    削除する
                </button>

                <a href="#" class="button button-secondary">
                    キャンセル
                </a>

            </div>

        </form>

    </div>

</section>

{% endblock %}
